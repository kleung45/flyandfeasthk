# 只發佈網站檔案到 GitHub Pages。
# 注意：不要改回 path: '.'，否則 pipeline/、outbox/、README.md 都會被公開讀取。
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 組裝要發佈的網站檔案
        run: |
          mkdir -p _site
          # 網站檔案白名單。**新增頂層目錄時必須加進來**，否則線上會 404
          # （2026-09-24 曾因漏了 deals/ guides/ about/ contact/ privacy/ terms/
          #   而全部子頁 404，首頁卻正常，極易誤判為部署成功）。
          SITE_ITEMS="index.html assets data robots.txt sitemap.xml CNAME ads.txt
                      deals guides about contact privacy terms"
          missing=""
          for item in $SITE_ITEMS; do
            [ -e "$item" ] || missing="$missing $item"
          done
          if [ -n "$missing" ]; then
            echo "::error::白名單中有項目不存在，請檢查：$missing"
            exit 1
          fi
          cp -r $SITE_ITEMS _site/
          # Google Search Console 網域驗證檔（不可刪除，否則驗證會失效）
          cp google*.html _site/ 2>/dev/null || true
          # 目錄式 URL（/deals/ → /deals/index.html）由 GitHub Pages 自動處理
          touch _site/.nojekyll
          echo "將發佈以下內容（共 $(find _site -type f | wc -l) 個檔案）："
          find _site -type f | sort | head -80

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 只上傳網站檔案。不要改成 '.'，否則 pipeline/ 與 outbox/ 會被公開讀取。
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
